<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三一匠造 3.6 客服与员工入口</title><style>body{max-width:850px;margin:8vh auto;padding:30px;font:16px/1.8 "Microsoft YaHei",sans-serif;background:#eef1ed;color:#20312a}a{display:inline-block;padding:12px 22px;margin:10px;background:#dfea36;color:#14251d;text-decoration:none}</style><h1>三一匠造客服订单交接平台</h1><p>先运行交付目录的“三一匠造-客服工作台-Windows便携版.exe”，或安装客服工作台。客服使用独立EXE，其他员工使用下方Web入口。</p><a href="http://127.0.0.1:8790/staff.html">员工Web门户</a><a href="http://127.0.0.1:8790/?workspace=customer#catalog">客户网站</a><p>首次空库在员工Web初始化超级管理员并创建员工账号。现有账号与Java/MySQL业务库继续使用。源码启动可运行“启动网页版.cmd”，需要Node.js；安装版和便携版自带运行资源。</p><p>本机模式保持服务运行。跨电脑须配置统一中心服务，详见部署与旧数据迁移.txt。默认静音，在个人设置导入本地音频副本。</p></html>
