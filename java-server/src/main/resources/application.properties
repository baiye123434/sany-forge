server.address=${SANY_PLATFORM_HOST:127.0.0.1}
server.port=${SANY_PLATFORM_PORT:8790}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.application.name=sany-forge-java
spring.datasource.url=${SANY_MYSQL_URL:jdbc:mysql://127.0.0.1:33307/sany_forge?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SANY_DB_USER:sany_forge}
spring.datasource.password=${SANY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.web.resources.add-mappings=false
spring.mvc.log-resolved-exception=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.tomcat.max-http-form-post-size=25165824
logging.level.root=INFO
